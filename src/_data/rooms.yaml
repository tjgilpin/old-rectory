title: Our Rooms
body: >-
  Rest and relax in our boutique bedrooms, each one different from the others
  but all equally luxurious; with high quality linens, bespoke Old Rectory
  toiletries, artisanal tea and coffee facilities and homemade biscuits. \


  Throughout October & November get 10% off all midweek stays - Use code MIDWEEK when booking!
order: 10
